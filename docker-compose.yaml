services:
    backend:
        build: ./python_backend
        ports:
            - "8000:8000"
        environment:
            BACKEND_PORT: "8000"
            OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}"
            DEFAULT_MODEL_NAME: "${DEFAULT_MODEL_NAME:-qwen2.5:1.5b}"
            OLLAMA_TIMEOUT_S: "${OLLAMA_TIMEOUT_S:-120}"
            OLLAMA_MAX_CONCURRENCY: "${OLLAMA_MAX_CONCURRENCY:-8}"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
    sidecar:
        build: .
        ports:
            - "50051:50051"
            - "9091:9090"
        depends_on:
            backend:
                condition: service_healthy
        environment:
            BACKEND_URL: "http://backend:8000/infer"
            VRAM_READER_MODE: "${VRAM_READER_MODE:-auto}"
            MAX_BATCH_SIZE: "${MAX_BATCH_SIZE:-8}"
            MAX_WAIT_MS: "${MAX_WAIT_MS:-50}"
            BACKEND_TIMEOUT_MS: "${BACKEND_TIMEOUT_MS:-120000}"
            POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-500}"
            OOM_THRESHOLD_PCT: "${OOM_THRESHOLD_PCT:-90}"
            CLOSE_THRESHOLD_PCT: "${CLOSE_THRESHOLD_PCT:-85}"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

    prometheus:
        image: prom/prometheus:v2.55.1
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
        depends_on:
            sidecar:
                condition: service_healthy

    grafana:
        image: grafana/grafana:11.4.0
        ports:
            - "3000:3000"
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning
        depends_on:
            - prometheus

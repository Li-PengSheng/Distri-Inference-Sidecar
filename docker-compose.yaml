services:
    backend:
        build: ./python_backend
        ports:
            - "8000:8000"
        environment:
            BACKEND_PORT: "8000"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
    sidecar:
        build: .
        ports:
            - "50051:50051"
            - "9091:9090"
        depends_on:
            backend:
                condition: service_healthy
        environment:
            BACKEND_URL: "http://backend:8000/infer"
            VRAM_READER_MODE: "${VRAM_READER_MODE:-auto}"
            MAX_BATCH_SIZE: "${MAX_BATCH_SIZE:-8}"
            MAX_WAIT_MS: "${MAX_WAIT_MS:-50}"
            BACKEND_TIMEOUT_MS: "${BACKEND_TIMEOUT_MS:-120000}"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

    prometheus:
        image: prom/prometheus:v2.55.1
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
        depends_on:
            sidecar:
                condition: service_healthy

    grafana:
        image: grafana/grafana:11.4.0
        ports:
            - "3000:3000"
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning
            - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/json/distri-sidecar.json:ro
        depends_on:
            - prometheus

version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ./gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ./gen
    opt: paths=source_relative
  # Python generated-stub configuration. Keep plugin versions aligned with the
  # runtime dependencies declared in python_backend/pyproject.toml.
  - remote: buf.build/protocolbuffers/python:v33.5  # Matches protobuf==6.33.5.
    out: python_backend/gen
  - remote: buf.build/grpc/python:v1.78.0           # Matches grpcio==1.78.0.
    out: python_backend/gen
  - remote: buf.build/protocolbuffers/pyi:v33.5     # Matches protobuf==6.33.5.
    out: python_backend/gen

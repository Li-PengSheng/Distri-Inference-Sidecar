name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - uses: dtolnay/rust-toolchain@stable

      - name: Build rust_ops
        run: cargo build --release --manifest-path rust_ops/Cargo.toml

      - name: Go test (race)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust_ops/target/release
        run: go test -race ./...

      - name: Rust test
        run: cargo test --manifest-path rust_ops/Cargo.toml

      - name: Python lint
        working-directory: python_backend
        run: uv run ruff check .
